<!doctype html>
<html lang="lt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Užsakymas | Obuolių skoniai</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Obuolių skoniai</h1>
      <nav>
        <ul>
          <li><a href="index.html">Pagrindinis</a></li>
          <li><a href="produktai.html">Produktai</a></li>
          <li><a href="apie.html">Apie mus</a></li>
          <li><a href="galerija.html">Galerija</a></li>
          <li><a href="uzsakymas.html">Užsakymas</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="intro">
        <h2>Užsisakykite mūsų gaminius</h2>
        <p>Pasirinkite mėgstamus gaminius ir pateikite užsakymą.</p>
      </section>

      <section class="order-section">
        <h2>Užsakymo forma</h2>

        <form action="#" method="post">
          <h3>Kontaktiniai duomenys</h3>

          <div class="form-grid">
            <div class="form-group">
              <label for="vardas">Vardas:</label>
              <input
                type="text"
                id="vardas"
                name="vardas"
                placeholder="Jūsų vardas"
                required
              />
            </div>

            <div class="form-group">
              <label for="pavarde">Pavardė:</label>
              <input
                type="text"
                id="pavarde"
                name="pavarde"
                placeholder="Jūsų pavardė"
                required
              />
            </div>

            <div class="form-group">
              <label for="email">El. paštas:</label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="vardas@email.lt"
                required
              />
            </div>

            <div class="form-group">
              <label for="telefonas">Telefono numeris:</label>
              <input
                type="tel"
                id="telefonas"
                name="telefonas"
                placeholder="+370"
              />
            </div>
          </div>

          <h3>Užsakymo informacija</h3>

          <div class="form-grid">
            <div class="form-group">
              <label for="produktas">Pasirinkite produktą:</label>
              <select id="produktas" name="produktas" required>
                <option value="">Pasirinkite produktą</option>
                <option value="suris">Naminis obuolių sūris</option>
                <option value="sultys">Šviežios obuolių sultys</option>
              </select>
            </div>

            <div class="form-group">
              <label for="kiekis">Kiekis:</label>
              <input
                type="number"
                id="kiekis"
                name="kiekis"
                min="1"
                value="1"
                required
              />
            </div>

            <div class="form-group">
              <label for="data">Pageidaujama atsiėmimo data:</label>
              <input type="date" id="data" name="data" min="2026-11-18" />
            </div>

            <div class="form-group">
              <label for="budas">Atsiėmimo būdas:</label>
              <select id="budas" name="budas">
                <option value="vietoje">Atsiėmimas vietoje</option>
                <option value="pristatymas">Pristatymas</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="pastabos">Papildomos pastabos:</label>
            <textarea
              id="pastabos"
              name="pastabos"
              rows="5"
              placeholder="Jūsų pageidavimai..."
            ></textarea>
          </div>

          <label class="consent">
            <input type="checkbox" name="sutikimas" required />
            Sutinku, kad mano pateikti duomenys būtų naudojami užsakymui
            apdoroti.
          </label>

          <button type="submit" id="order-button">Pateikti užsakymą</button>
        </form>
      </section>
    </main>

    <footer id="footer">
      <p>© 2026 Obuolių skoniai. Visos teisės saugomos.</p>
    </footer>
  </body>
</html>

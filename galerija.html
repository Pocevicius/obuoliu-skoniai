    <main>

      </section>

      <section class="gallery-section">
        <h2>Obuolių skonių akimirkos</h2>

        <div class="gallery-grid">
          <figure class="gallery-item">
            <img
              src="images/obuoliai/obuoliai-sode.png"
              alt="Prinokę obuoliai sode"
            />
            <figcaption>Obuoliai mūsų sode</figcaption>
          </figure>

          <figure class="gallery-item">
            <img
              src="images/obuoliai/derlius.png"
              alt="Surinktas obuolių derlius"

          <figure class="gallery-item">
            <img
              src="images/obuoliai/virimas.png"

          </figure>

          <figure class="gallery-item">
            <img
              src="images/obuoliai/suris-galerijai.png"
              alt="Naminis obuolių sūris"
            />

          <figure class="gallery-item">
            <img
              src="images/obuoliai/sultys-galerijoje.png"
